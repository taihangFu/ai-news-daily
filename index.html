<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 新工具日報</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --accent: #0071e3;
      --accent-hover: #0077ed;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    header {
      background: rgba(255,255,255,0.72);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 600; font-size: 1.25rem; letter-spacing: -0.01em; }
    nav span {
      margin-left: 24px;
      color: var(--muted);
      font-weight: 500;
      font-size: 0.95rem;
    }
    .main {
      display: block;
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 0 0;
    }
    .date-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 20px;
      margin-bottom: 28px;
      font-size: 0.875rem;
      color: #86868b;
    }
    .date-nav[hidden] { display: none !important; }
    .date-nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .date-nav-arrow {
      background: none;
      border: none;
      color: #86868b;
      font-size: 1.125rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      font-family: inherit;
    }
    .date-nav-arrow:hover:not(:disabled) { color: #1d1d1f; }
    .date-nav-arrow:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .date-nav-label {
      color: #1d1d1f;
      font-weight: 500;
      min-width: 4.5em;
      text-align: center;
    }
    .date-nav-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: flex-end;
    }
    .date-nav-list button {
      background: none;
      border: none;
      color: #86868b;
      font-size: 0.875rem;
      font-family: inherit;
      cursor: pointer;
      padding: 0;
      line-height: 1.4;
    }
    .date-nav-list button:hover { color: #1d1d1f; }
    .date-nav-list button.is-active {
      color: #1d1d1f;
      font-weight: 500;
    }
    .section-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .headline {
      background: var(--card);
      border: none;
      border-radius: 18px;
      padding: 48px 40px;
      margin-bottom: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .headline h2 {
      font-size: 2.25rem;
      line-height: 1.25;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .headline .meta { color: var(--muted); font-size: 0.8125rem; margin-bottom: 16px; letter-spacing: 0.02em; }
    .headline p { color: var(--muted); font-size: 1.05rem; line-height: 1.7; }
    .reports { display: grid; gap: 16px; }
    .report-card {
      background: var(--card);
      border: none;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: box-shadow 0.28s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .report-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .report-card .tag {
      display: inline-block;
      background: rgba(0,0,0,0.04);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-bottom: 8px;
    }
    .report-card h3 { font-size: 1.1rem; margin-bottom: 8px; font-weight: 600; letter-spacing: -0.01em; }
    .report-card p { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    .footer { display: flex; justify-content: flex-end; font-size: 0.875rem; }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 400;
      transition: opacity 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .footer a:hover { color: var(--accent-hover); text-decoration: none; }
    .site-footer {
      max-width: 720px;
      margin: 64px auto 56px;
      padding: 0 20px;
      text-align: center;
      color: var(--muted);
    }
    .site-footer h3 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 12px;
    }
    .site-footer p { font-size: 0.9rem; margin-bottom: 16px; line-height: 1.7; }
    .site-footer .about-box {
      margin: 0 auto;
      max-width: 520px;
      padding: 12px 16px;
      background: transparent;
      border: none;
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      box-shadow: none;
    }
    .site-footer .about-box strong { color: var(--text); }
    .date-group { margin-bottom: 32px; }
    .date-label { font-weight: 600; margin-bottom: 12px; color: var(--muted); font-size: 0.875rem; }
    @media (max-width: 900px) {
      .main { padding: 40px 0 0; }
      .site-footer { margin: 48px auto 40px; }
      .headline { padding: 32px 24px; }
      .headline h2 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">AI 新工具日報</div>
      <nav>
        <span>首頁</span>
      </nav>
    </div>
  </header>

  <div class="container main">
    <nav class="date-nav" id="date-nav" hidden aria-label="歷史日期">
      <div class="date-nav-controls">
        <button type="button" class="date-nav-arrow" id="date-prev" aria-label="較早一日">‹</button>
        <span class="date-nav-label" id="date-label">今日</span>
        <button type="button" class="date-nav-arrow" id="date-next" aria-label="較近一日">›</button>
      </div>
      <div class="date-nav-list" id="date-list"></div>
    </nav>

    <main>
      <section id="home">
        <h2 class="section-title">今日頭條</h2>
        <div class="headline">
          <div class="meta">載入中…</div>
          <h2></h2>
          <p></p>
        </div>
      </section>

      <section id="reports" style="margin-top: 48px;">
        <h2 class="section-title">最新報告</h2>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <h3>每天的 AI 新工具與產品，來自 X</h3>
    <p>專注追蹤 X 上正在熱議的 AI 新產品、新工具、新模型與開源項目。</p>
    <div class="about-box">
      <strong>關於這個站</strong><br>
      用 AI 創造價值，把個人能力經營成事業。專注新工具與新產品。
    </div>
  </footer>
  <script>
    function extractUrl(footer) {
      if (!footer) return '';
      const m = String(footer).match(/https?:\/\/\S+/);
      return m ? m[0] : '';
    }

    function todayISO() {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Hong_Kong',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date());
    }

    function formatDayLabel(iso) {
      if (iso === todayISO()) return '今日';
      const parts = iso.split('-');
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      return m + '月' + d + '日';
    }

    function formatListLabel(iso) {
      const parts = iso.split('-');
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      return m + '月' + d + '日';
    }

    let archiveDates = [];
    let timeline = [];
    let currentDate = todayISO();

    function pathForDate(iso) {
      if (iso === todayISO()) return 'data.json';
      const entry = archiveDates.find(function (e) { return e && e.date === iso; });
      return entry && entry.path ? entry.path : null;
    }

    function buildTimeline() {
      const set = new Set();
      archiveDates.forEach(function (e) {
        if (e && e.date) set.add(e.date);
      });
      set.add(todayISO());
      return Array.from(set).sort();
    }

    function renderDateNav() {
      const nav = document.getElementById('date-nav');
      if (!archiveDates.length) {
        nav.hidden = true;
        return;
      }
      nav.hidden = false;
      timeline = buildTimeline();
      document.getElementById('date-label').textContent = formatDayLabel(currentDate);

      const idx = timeline.indexOf(currentDate);
      const prevBtn = document.getElementById('date-prev');
      const nextBtn = document.getElementById('date-next');
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx < 0 || idx >= timeline.length - 1;

      const list = document.getElementById('date-list');
      list.innerHTML = '';
      archiveDates.forEach(function (e) {
        if (!e || !e.date) return;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = formatListLabel(e.date);
        if (e.date === currentDate) {
          btn.className = 'is-active';
          btn.setAttribute('aria-current', 'true');
        }
        btn.addEventListener('click', function () { selectDate(e.date); });
        list.appendChild(btn);
      });
    }

    async function selectDate(iso) {
      if (!iso || iso === currentDate) return;
      const path = pathForDate(iso);
      if (!path && iso !== todayISO()) return;
      currentDate = iso;
      renderDateNav();
      await loadData(pathForDate(iso) || 'data.json');
    }

    async function loadData(url) {
      const src = url || 'data.json';
      try {
        const res = await fetch(src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now());
        const data = await res.json();

        const home = document.querySelector('#home');
        home.innerHTML = '<h2 class="section-title">今日頭條</h2>';
        const headlines = (data.headlines || []).slice(0, 1);
        headlines.forEach(h => {
          const div = document.createElement('div');
          div.className = 'headline';
          const hLink = h.link || extractUrl(h.footer) || '';
          const hRead = hLink
            ? `<div class="footer" style="margin-top:20px;justify-content:flex-end"><a href="${hLink}" target="_blank" rel="noopener noreferrer">閱讀 →</a></div>`
            : '';
          div.innerHTML = `
            <div class="meta">${h.meta || ''}</div>
            <h2>${h.title || ''}</h2>
            <p>${h.summary || ''}</p>
            ${hRead}
          `;
          home.appendChild(div);
        });

        const headlineTitles = new Set(headlines.map(h => (h.title || '').trim()));
        const reportsSection = document.querySelector('#reports');
        reportsSection.innerHTML = '<h2 class="section-title">最新報告</h2>';
        (data.reports || []).forEach(group => {
          const items = (group.items || []).filter(item => !headlineTitles.has((item.title || '').trim()));
          if (!items.length) return;
          const groupDiv = document.createElement('div');
          groupDiv.className = 'date-group';
          groupDiv.innerHTML = `<div class="date-label">${group.date || ''}</div><div class="reports"></div>`;
          const container = groupDiv.querySelector('.reports');
          items.forEach(item => {
            const url = extractUrl(item.footer);
            const card = document.createElement('div');
            card.className = 'report-card';
            const readLink = url
              ? `<a href="${url}" target="_blank" rel="noopener noreferrer">閱讀 →</a>`
              : `<span style="color:var(--muted)">閱讀 →</span>`;
            card.innerHTML = `
              <span class="tag">${item.tag || ''}</span>
              <h3>${item.title || ''}</h3>
              <p>${item.summary || ''}</p>
              <div class="footer">${readLink}</div>
            `;
            container.appendChild(card);
          });
          reportsSection.appendChild(groupDiv);
        });
      } catch (e) {
        console.error('Failed to load data', e);
      }
    }

    async function init() {
      try {
        const res = await fetch('archive/index.json?t=' + Date.now());
        if (res.ok) {
          const index = await res.json();
          archiveDates = Array.isArray(index.dates) ? index.dates : [];
        }
      } catch (e) {
        archiveDates = [];
      }
      currentDate = todayISO();
      renderDateNav();
      document.getElementById('date-prev').addEventListener('click', function () {
        const idx = timeline.indexOf(currentDate);
        if (idx > 0) selectDate(timeline[idx - 1]);
      });
      document.getElementById('date-next').addEventListener('click', function () {
        const idx = timeline.indexOf(currentDate);
        if (idx >= 0 && idx < timeline.length - 1) selectDate(timeline[idx + 1]);
      });
      await loadData('data.json');
    }

    init();
  </script>
</body>
</html>
