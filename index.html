<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 新產品 · 每日工具站</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #fff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --sidebar-bg: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    header {
      background: rgba(255,255,255,0.72);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 600; font-size: 1.25rem; letter-spacing: -0.01em; }
    nav span {
      margin-left: 24px;
      color: var(--muted);
      font-weight: 500;
      font-size: 0.95rem;
    }
    .main { display: grid; grid-template-columns: 1fr 320px; gap: 40px; padding: 64px 0 56px; }
    .section-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: 600; letter-spacing: -0.02em; }
    .headline {
      background: var(--card);
      border: none;
      border-radius: 18px;
      padding: 44px 36px;
      margin-bottom: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .headline h2 {
      font-size: 2.25rem;
      line-height: 1.25;
      margin-bottom: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .headline .meta { color: var(--muted); font-size: 0.8125rem; margin-bottom: 16px; letter-spacing: 0.02em; }
    .headline p { color: var(--muted); font-size: 1.05rem; line-height: 1.7; }
    .reports { display: grid; gap: 16px; }
    .report-card {
      background: var(--card);
      border: none;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: box-shadow 0.28s cubic-bezier(0.25, 0.1, 0.25, 1), transform 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .report-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .report-card .tag {
      display: inline-block;
      background: #f5f5f7;
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-bottom: 8px;
    }
    .report-card h3 { font-size: 1.1rem; margin-bottom: 8px; font-weight: 600; letter-spacing: -0.01em; }
    .report-card p { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    .footer { display: flex; justify-content: flex-end; font-size: 0.875rem; }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .footer a:hover { color: var(--accent-hover); text-decoration: none; }
    .sidebar {
      background: var(--sidebar-bg);
      border: none;
      border-radius: 18px;
      padding: 24px;
      height: fit-content;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .sidebar h3 { margin-bottom: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .sidebar p { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; }
    .about-box {
      margin: 20px 0 0;
      padding: 12px;
      background: #f5f5f7;
      border: none;
      border-radius: 12px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .about-box strong { color: var(--text); }
    .date-group { margin-bottom: 32px; }
    .date-label { font-weight: 600; margin-bottom: 12px; color: var(--muted); font-size: 0.875rem; }
    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; padding: 40px 0 48px; }
      .sidebar { order: -1; }
      .headline { padding: 32px 24px; }
      .headline h2 { font-size: 1.75rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">AI 新產品 · 每日工具站</div>
      <nav>
        <span>首頁</span>
      </nav>
    </div>
  </header>

  <div class="container main">
    <main>
      <section id="home">
        <h2 class="section-title">今日頭條</h2>
        <div class="headline">
          <div class="meta">載入中…</div>
          <h2></h2>
          <p></p>
        </div>
      </section>

      <section id="reports" style="margin-top: 48px;">
        <h2 class="section-title">最新報告</h2>
      </section>
    </main>

    <aside class="sidebar">
      <h3>每天的 AI 新工具與產品，來自 X</h3>
      <p>專注追蹤 X 上正在熱議的 AI 新產品、新工具、新模型與開源項目。每天由 Grok Bot 輔助掃描高互動帖子，整理成可快速閱讀的簡報。</p>
      <div class="about-box">
        <strong>關於這個站</strong><br>
        用 AI 創造價值，把個人能力經營成事業。專注新工具與新產品。
      </div>
    </aside>
  </div>
  <script>
    function extractUrl(footer) {
      if (!footer) return '';
      const m = String(footer).match(/https?:\/\/\S+/);
      return m ? m[0] : '';
    }

    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();

        const home = document.querySelector('#home');
        home.innerHTML = '<h2 class="section-title">今日頭條</h2>';
        const headlines = (data.headlines || []).slice(0, 1);
        headlines.forEach(h => {
          const div = document.createElement('div');
          div.className = 'headline';
          const hLink = h.link || extractUrl(h.footer) || '';
          const hRead = hLink
            ? `<div class="footer" style="margin-top:20px;justify-content:flex-end"><a href="${hLink}" target="_blank" rel="noopener noreferrer">閱讀 →</a></div>`
            : '';
          div.innerHTML = `
            <div class="meta">${h.meta || ''}</div>
            <h2>${h.title || ''}</h2>
            <p>${h.summary || ''}</p>
            ${hRead}
          `;
          home.appendChild(div);
        });

        const headlineTitles = new Set(headlines.map(h => (h.title || '').trim()));
        const reportsSection = document.querySelector('#reports');
        reportsSection.innerHTML = '<h2 class="section-title">最新報告</h2>';
        (data.reports || []).forEach(group => {
          const items = (group.items || []).filter(item => !headlineTitles.has((item.title || '').trim()));
          if (!items.length) return;
          const groupDiv = document.createElement('div');
          groupDiv.className = 'date-group';
          groupDiv.innerHTML = `<div class="date-label">${group.date || ''}</div><div class="reports"></div>`;
          const container = groupDiv.querySelector('.reports');
          items.forEach(item => {
            const url = extractUrl(item.footer);
            const card = document.createElement('div');
            card.className = 'report-card';
            const readLink = url
              ? `<a href="${url}" target="_blank" rel="noopener noreferrer">閱讀 →</a>`
              : `<span style="color:var(--muted)">閱讀 →</span>`;
            card.innerHTML = `
              <span class="tag">${item.tag || ''}</span>
              <h3>${item.title || ''}</h3>
              <p>${item.summary || ''}</p>
              <div class="footer">${readLink}</div>
            `;
            container.appendChild(card);
          });
          reportsSection.appendChild(groupDiv);
        });
      } catch (e) {
        console.error('Failed to load data', e);
      }
    }
    loadData();
  </script>
</body>
</html>
